<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f5f3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Tudum</title>
</head>
<body>
<header>
  <div><h1 id="title"></h1><small id="sub"></small></div>
  <input type="date" id="date">
</header>
<main id="today"></main>
<h2><button id="prev">‹</button><span id="wk"></span><button id="next">›</button></h2>
<section id="history" class="card"></section>
<footer><button id="export">Export</button><button id="import">Import</button></footer>
<input id="file" type="file" accept=".json" hidden>
<button id="add" aria-label="Add habit">+</button>
<dialog id="dlg">
  <form method="dialog" id="form">
    <input name="name" placeholder="Habit name" required>
    <div id="colors"></div>
    <div class="seg">
      <label><input type="radio" name="bad" value="0" checked>Good</label>
      <label><input type="radio" name="bad" value="1">Bad</label>
    </div>
    <div class="seg">
      <label><input type="radio" name="max" value="1" checked>Yes / No</label>
      <label><input type="radio" name="max" value="5">Scale</label>
    </div>
    <div class="actions">
      <button value="save" class="primary">Save</button>
      <button value="del" id="del" formnovalidate>Delete</button>
      <button value="cancel" formnovalidate>Cancel</button>
    </div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
